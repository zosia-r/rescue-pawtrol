services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: rescue_pawtrol
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      # Skrypt, który przy pierwszym uruchomieniu automatycznie stworzy bazę 'keycloak'
      # obok Twojej głównej bazy 'rescue_pawtrol'
      POSTGRES_MULTIPLE_DATABASES: keycloak
    ports:
      - "5434:5432"
    volumes:
      - fresh_postgres_data:/var/lib/postgresql/data
      # Podpięcie skryptu inicjalizującego do kontenera Postgresa
      - ./init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d rescue_pawtrol"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: rescue_pawtrol
      DB_USER: admin
      DB_PASSWORD: password123
      FRONTEND_ORIGIN: http://localhost,http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # KONFIGURACJA POŁĄCZENIA Z POSTGRES:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: admin
      KC_DB_PASSWORD: password123
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm.json
      - ./keycloak/themes:/opt/keycloak/themes
    depends_on:
      db:
        condition: service_healthy

volumes:
  fresh_postgres_data: