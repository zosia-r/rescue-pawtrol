server.port=8080

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rescue_pawtrol}
spring.datasource.username=${DB_USER:admin}
spring.datasource.password=${DB_PASSWORD:password123}

# Hibernate nie mo?e sprawdza? bazy, zanim Flyway jej nie stworzy
spring.jpa.hibernate.ddl-auto=none
# Poinformuj Springa, ?eby czeka? na Flywaya
spring.jpa.show-sql=true
spring.flyway.enabled=true
# Zmieniamy na ?cie?k? systemow? w kontenerze:
spring.flyway.locations=filesystem:/app/db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.ignore-missing-migrations=true
# To sprawi, ?e je?li Flyway nie znajdzie historii, to j? utworzy
spring.flyway.baseline-version=0


spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/rescuepawtrol
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://keycloak:8080/realms/rescuepawtrol/protocol/openid-connect/certs